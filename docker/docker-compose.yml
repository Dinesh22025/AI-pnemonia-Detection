version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pneumovision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pneumovision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: pneumovision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pneumovision-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/pneumovision
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-pneumovision-super-secret-key}
      DEBUG: "false"
      # Paths inside the container (backend code lives in /app)
      MODEL_PATH: /deep_learning/model.keras
      UPLOAD_DIR: /uploads
    env_file:
      - ../backend/.env
    volumes:
      - ../uploads:/uploads
      - ../static:/static
      - ../logs:/logs
      - ../reports:/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Frontend Next.js Service
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pneumovision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Next.js standalone binds to $HOSTNAME if set; force 0.0.0.0 to listen on all interfaces
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      # wget --spider not in alpine node image; use node http with IPv4 127.0.0.1
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pneumovision-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../static:/usr/share/nginx/html/static:ro
      - ../uploads:/usr/share/nginx/html/uploads:ro
    command: ["nginx", "-g", "daemon off;"]

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: pneumovision-network
    driver: bridge
